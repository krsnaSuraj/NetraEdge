# MobileFaceNet Recognition Model Configuration
# Target: >97% accuracy on LFW, <5MB INT8

model:
  architecture: "MobileFaceNet"
  input_size: [112, 112]
  embedding_dim: 128
  use_depthwise_separable: true
  use_attention: true

loss:
  type: "ArcFace"
  margin: 0.5
  scale: 64

distillation:
  enabled: true
  teacher_model: "ArcFace-R100"
  temperature: 4.0
  alpha: 0.7  # weight for distillation loss

training:
  optimizer: "AdamW"
  learning_rate: 1e-3
  weight_decay: 1e-4
  batch_size: 128
  epochs: 30
  lr_scheduler: "CosineAnnealing"
  warmup_epochs: 2
  early_stopping_patience: 5

augmentation:
  random_brightness: [-30, 30]
  random_contrast: [0.7, 1.3]
  random_rotation: [-15, 15]
  random_horizontal_flip: true
  gaussian_noise: [0, 10]
  random_crop: [0.8, 1.0]
  color_jitter: true
  normalize: true

datasets:
  train:
    - name: "VGGFace2"
      path: "data/vggface2/train"
      max_identities: 8631
    - name: "IMFDB"
      path: "data/imfdb"
      max_identities: 100
  val:
    - name: "LFW"
      path: "data/lfw"
  test:
    - name: "LFW"
      path: "data/lfw"

export:
  format: "tflite"
  quantization: "int8"
  representative_dataset_size: 100
