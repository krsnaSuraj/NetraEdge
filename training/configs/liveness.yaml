# Liveness Detection Model Configuration
# Target: >95% accuracy on CelebA-Spoof, <3MB INT8

model:
  architecture: "LivenessCNN"
  input_size: [112, 112]
  num_classes: 3  # real, print_attack, screen_attack
  use_depthwise_separable: true
  dropout_rate: 0.3

loss:
  type: "CrossEntropy"
  label_smoothing: 0.1
  class_weights: [1.0, 1.5, 1.5]  # weight attacks higher

training:
  optimizer: "AdamW"
  learning_rate: 5e-4
  weight_decay: 1e-4
  batch_size: 64
  epochs: 20
  lr_scheduler: "CosineAnnealing"
  warmup_epochs: 1
  early_stopping_patience: 5

augmentation:
  random_brightness: [-30, 30]
  random_contrast: [0.7, 1.3]
  random_rotation: [-10, 10]
  random_horizontal_flip: true
  jpeg_compression: [50, 100]  # simulate photo re-capture
  screen_moire: true          # simulate screen artifacts
  normalize: true

datasets:
  train:
    - name: "CelebA-Spoof"
      path: "data/celeba_spoof/train"
    - name: "NUAA"
      path: "data/nuaa/train"
  val:
    - name: "CelebA-Spoof"
      path: "data/celeba_spoof/val"
  test:
    - name: "CelebA-Spoof"
      path: "data/celeba_spoof/test"
    - name: "Replay-Attack"
      path: "data/replay_attack/test"

export:
  format: "tflite"
  quantization: "int8"
  representative_dataset_size: 100
